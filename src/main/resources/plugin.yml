name: TerrainLab
version: '0.1.0'
main: io.github.terrainlab.TerrainLabPlugin
api-version: '26.3'
description: Collect natural terrain snapshots and inspect them in a gallery.
commands:
  terrain:
    description: Collect and inspect terrain snapshots.
    usage: /terrain help
    permission: terrainlab.admin
    permission-message: You need terrainlab.admin permission.
permissions:
  terrainlab.admin:
    default: op
    description: Manage terrain collection and preview.
